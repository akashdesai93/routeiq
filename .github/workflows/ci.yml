name: CI

# The web checks: typecheck, lint, unit tests, the production build and its size budget,
# and the iPhone shell's web side (its unit tests, web build and Xcode project, on Linux).
# Called by gate.yml on every pull request and every push to main (it has no triggers of
# its own, so each change runs once); it can also be started by hand.
#
# The unit tests include the counted-work guards: how many route requests a drive may
# make (tests/drive.test.ts, "request budget"), that a signal tile is asked for at most
# once, and the reroute and matching rules. They run as part of `npm test`.

on:
  workflow_call:
    outputs:
      size-growth:
        description: What a pull request adds to the bundle against the main it was tested on (JSON, scripts/bundle-size.mjs growthReport); empty when not measured. Read by gate.yml's required job.
        value: ${{ jobs.check.outputs.size-growth }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      size-growth: ${{ steps.growth.outputs.growth }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request run tests the merge of the PR into main; its first parent is that main,
          # which the bundle growth step builds too.
          fetch-depth: 2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native/shell/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # A made-up token, as in the e2e builds: nothing here talks to Mapbox.
      - name: Build
        env:
          VITE_MAPBOX_TOKEN: pk.test
        run: npm run build

      # The owner's ceiling (scripts/bundle-budget.json, #170). Fails the job when over it; no label passes it.
      - name: Bundle size against the ceiling (scripts/bundle-budget.json)
        run: npm run size

      # What this pull request adds: main as this run saw it (the merge commit's first parent) is
      # built the same way and measured with this PR's script. The step reports only; the growth
      # limit is applied by gate.yml's required job (scripts/orch/gates.mjs), so the size-ok label
      # can pass it by re-running that job alone. A failure here leaves the output empty, which the
      # gate reads as "not measured" and fails.
      - name: Bundle growth against main (pull requests)
        id: growth
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          VITE_MAPBOX_TOKEN: pk.test
        run: |
          base="$RUNNER_TEMP/main"
          git worktree add --detach "$base" HEAD^1
          if cmp -s package-lock.json "$base/package-lock.json"; then
            ln -s "$PWD/node_modules" "$base/node_modules"
          else
            (cd "$base" && npm ci --ignore-scripts)
          fi
          (cd "$base" && npx vite build --logLevel warn)
          node scripts/check-bundle-size.mjs --against "$base/dist"

      # What a change to the web app can break in the iPhone shell, checked here in seconds:
      # the shell's unit tests (Info.plist patch, bridge script, token search), the web app
      # built into native/shell/www with no token and the bridge script (build-web.mjs fails
      # on a token in the bundle, paths outside the site root, or missing signal tiles), and
      # the Xcode project generated and patched from it (generate-ios.mjs checks the plugin
      # is linked and registered and the web app was copied in). Compiling and packaging the
      # .ipa needs macOS: shell-ios.yml, on the pull requests and pushes listed in gate.yml.
      - name: Shell (native/shell) unit tests, web build with no token, Xcode project
        working-directory: native/shell
        env:
          VITE_MAPBOX_TOKEN: ''
        run: |
          npm ci
          npm test
          npm run build
          npm run ios:generate
          if LC_ALL=C grep -r -a -l -E '[ps]k\.eyJ[A-Za-z0-9_-]{8,}' www ios; then
            echo "::error::a Mapbox token was found in the shell's web build or Xcode project (files listed above)"
            exit 1
          fi
          echo "no Mapbox token in native/shell/www or native/shell/ios"

      # Known vulnerabilities in what ships (no dev dependencies), in the three projects.
      # It warns and never fails the job: a new advisory must not block unrelated work.
      - name: npm audit (warns, does not block)
        run: |
          for dir in . native/shell design; do
            echo "::group::npm audit in $dir"
            if (cd "$dir" && npm audit --omit=dev --audit-level=high); then
              echo "- \`$dir\`: no high or critical advisory" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning title=npm audit::High or critical advisory (or the audit could not run) in $dir. See the 'npm audit' step."
              echo "- \`$dir\`: **high or critical advisory, or the audit failed** (see the npm audit step)" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done
