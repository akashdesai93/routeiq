name: native-core

# Builds and tests the pure Swift package native/RouteIQCore (the RouteIQCore
# and RouteIQKit libraries) on Linux. It has no Apple frameworks, so a Linux
# runner is enough and starts fastest. The GitHub-hosted ubuntu-24.04 image
# ships a Swift toolchain, so nothing is downloaded.
#
# Called by gate.yml on pull requests and pushes to main that touch the Swift package
# (the path list is in gate.yml, under `changes`), and its result counts towards the
# `required` check. It has no triggers of its own, so each change runs once; it can
# also be started by hand.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: native/RouteIQCore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test
      - name: Test the signal bundle packer
        working-directory: .
        run: node --test native/scripts/pack-signal-bundle.test.mjs
