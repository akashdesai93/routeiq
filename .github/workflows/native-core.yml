name: native-core

# Builds and tests the pure Swift package native/RouteIQCore (the RouteIQCore
# and RouteIQKit libraries) on Linux. It has no Apple frameworks, so a Linux
# runner is enough and starts fastest. The GitHub-hosted ubuntu-24.04 image
# ships a Swift toolchain, so nothing is downloaded.
#
# Push runs only on main; a branch is tested through its pull request, so
# each change runs once.
on:
  push:
    branches: [main]
    paths:
      - 'native/RouteIQCore/**'
      - 'native/scripts/**'
      - 'public/seed/osm-signals/**'
      - 'tests/fixtures/**'
      - '.github/workflows/native-core.yml'
  pull_request:
    paths:
      - 'native/RouteIQCore/**'
      - 'native/scripts/**'
      - 'public/seed/osm-signals/**'
      - 'tests/fixtures/**'
      - '.github/workflows/native-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: native/RouteIQCore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test
      - name: Test the signal bundle packer
        working-directory: .
        run: node --test native/scripts/pack-signal-bundle.test.mjs
