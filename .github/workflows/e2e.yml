name: E2E

# The end-to-end scenarios (npm run e2e): the production build in headless
# Chromium, fully offline. No secrets: the test builds use a dummy pk.test
# token and every outside request is answered by the test itself.

on:
  pull_request:
    paths-ignore:
      - "native/**"
  push:
    branches: [main]
    paths-ignore:
      - "native/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Headless Chromium only (no full browser), plus the system libraries it needs.
      - run: npx playwright install --with-deps --only-shell chromium

      - run: npm run e2e

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: e2e-report/
          retention-days: 14
