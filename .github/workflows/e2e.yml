name: E2E

# The end-to-end scenarios (npm run e2e): the production build in headless
# Chromium, fully offline. No secrets: the test builds use a dummy pk.test
# token and every outside request is answered by the test itself.
#
# Called by gate.yml on every pull request and every push to main (it has no triggers
# of its own, so each change runs once); it can also be started by hand.
#
# The scenarios are CPU-bound (Mapbox GL drawn in software, plus the video of every
# scenario), so they are spread over several runners: each shard runs its share
# (e2e/shard.mjs deals every scenario to exactly one shard and checks that it did) with
# two browsers on the runner's four cores. Shards are dealt by weight (a drive counts ten short scenarios). Each shard uploads a blob report; the report
# job (e2e-report.yml) merges them into the one `e2e-report`. In gate.yml that merge
# runs after the shards but is not part of `required`, so it adds no waiting time.
#
# To change the number of shards, change the list under `matrix.shard` only: the
# total comes from `strategy.job-total`, so the deal always covers every scenario.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: e2e scenarios (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Every shard finishes, so the report shows every broken scenario, not just the first.
      # Any failed shard still fails this workflow, and with it `required`.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # A new key: the old one (playwright-Linux-<version>) was never restored on the Gate
      # runs measured on 2026-11-12, and every save failed with "another job may be
      # creating this cache".
      - name: Cache the browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}

      # Headless Chromium only (no full browser), plus the system libraries it needs.
      - run: npx playwright install --with-deps --only-shell chromium

      - run: npm run e2e:build

      - name: Run this shard's scenarios
        env:
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/report-${{ matrix.shard }}.zip
        run: node e2e/shard.mjs ${{ matrix.shard }} ${{ strategy.job-total }} --workers=2 --reporter=blob,list

      - name: Upload the shard's blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-blob-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: error
          retention-days: 3

  # Started by hand, this workflow merges its own report. Called from gate.yml (where
  # github.event_name is the gate's event), gate.yml runs the merge itself, outside `required`.
  report:
    needs: e2e
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/e2e-report.yml
