name: E2E report

# Merges the e2e shards' blob reports (e2e.yml) into the one report a whole run writes:
# e2e-report/index.html (each scenario's screenshots, what was said, the video) and
# Playwright's own report in e2e-report/playwright. Uploaded as `e2e-report`.
#
# Called by gate.yml after the shards (also when one failed), and by e2e.yml when that is
# started by hand. It is evidence, not a check: it is not part of `required`.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  report:
    name: e2e report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-blob-*
          path: blob-report
          merge-multiple: true

      - run: npx playwright merge-reports --config e2e/merge.config.ts blob-report

      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: e2e-report/
          if-no-files-found: error
          retention-days: 14
