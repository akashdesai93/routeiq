name: CodeQL

# Static security analysis of the JavaScript and TypeScript (the web app, the scripts,
# the shell's bridge and the design workspace). Findings appear under Security > Code
# scanning and as annotations on the pull request. It is not part of the `required`
# check: a finding is reviewed, it does not block by itself.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1" # Mondays 06:23 UTC, to catch new queries on unchanged code
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # uploads the results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
