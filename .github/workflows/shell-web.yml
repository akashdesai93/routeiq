name: Shell web (Linux)

# What a change to the web app can break in the iPhone shell, checked on Linux in
# seconds: the shell's unit tests (Info.plist patch, bridge script, token search), the
# web app built into www/ with no token and the bridge script added (build-web.mjs
# fails on a token in the bundle, on paths outside the site root, or on missing signal
# tiles), and the Xcode project generated and patched from it (generate-ios.mjs checks
# the plugin is linked and registered and the web app was copied in).
#
# What it does not do is compile and package the .ipa on macOS: shell-ios.yml does
# that, on pull requests that touch the shell's own inputs and on every push to main
# that touches the web app (gate.yml, `changes`), so the newest main always has a
# current RouteIQ-unsigned build.
#
# Called by gate.yml; it can also be started by hand.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: shell web build and checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: native/shell
    env:
      # Never a token in this build, whatever the repository's settings hold.
      VITE_MAPBOX_TOKEN: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native/shell/package-lock.json

      - name: Install the web app's dependencies
        working-directory: .
        run: npm ci

      - name: Install the shell's dependencies
        run: npm ci

      - name: Unit tests (Info.plist patch, bridge script, token search)
        run: npm test

      - name: Build the web app into www/ (no token) and add the bridge script
        run: npm run build

      - name: Generate and patch the Xcode project
        run: npm run ios:generate

      - name: No Mapbox token in the generated project
        run: |
          if LC_ALL=C grep -r -a -l -E '[ps]k\.eyJ[A-Za-z0-9_-]{8,}' www ios; then
            echo "::error::a Mapbox token was found (files listed above)"
            exit 1
          fi
          echo "no Mapbox token in www/ or ios/"
